<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galactic WLED</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#0b0b15;color:#eee8fb}*{box-sizing:border-box}body{max-width:820px;margin:auto;padding:26px 18px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.65rem;margin:0}p{color:#a6a0b9}section{background:#171524;border:1px solid #302a43;border-radius:18px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;color:#c3b9d6;font-size:.9rem}select,button,input[type=text]{font:inherit;color:inherit;background:#252036;border:1px solid #493c60;border-radius:9px;padding:11px;width:100%;margin-top:8px}button{cursor:pointer;background:#563b7e}input[type=range]{width:100%;accent-color:#b087ef;margin-top:14px}input[type=checkbox]{accent-color:#b087ef}.row{display:flex;gap:12px;align-items:center}.row button{width:auto}output{float:right;color:#e4caff}.meter{height:7px;background:#30283e;border-radius:4px;margin:8px 0 16px;overflow:hidden}.meter i{display:block;width:0;height:100%;background:linear-gradient(90deg,#7355ca,#e9a3cf);transition:width .15s}#status,#error{font-size:.85rem}#error{color:#f2a3ac;white-space:pre-wrap}.pill{padding:8px 12px;border-radius:20px;background:#28213a;font-size:.8rem}details{margin-top:16px}summary{cursor:pointer;color:#c9b3eb}small{color:#a69ab7} @media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:1.4rem}}
</style><header><div><h1>Galactic WLED</h1><p>53 × 11 · Light that listens</p></div><span class="pill" id="connection">Connecting</span></header>
<div id="error" role="alert"></div><section><div class="row"><label><input id="power" type="checkbox"> Power</label><label><input id="audio_reactive" type="checkbox"> Audio reactive</label></div><br><label>Brightness <output id="brightnessValue"></output><input id="brightness" type="range" min="0" max="1" step=".01"></label><div class="grid"><label>Effect<select id="effect"></select></label><label>Palette<select id="palette"></select></label></div><label style="margin-top:18px">Preset<select id="preset"></select></label></section>
<section><h2 style="font-size:1rem;margin-top:0">Shape the motion</h2><div class="grid" id="parameters"></div></section>
<section><h2 style="font-size:1rem;margin-top:0">Audio energy</h2><div class="grid" id="meters"></div><small id="status"></small></section>
<section><div class="row"><button id="save">Save startup</button><button id="showcase">Start showcase</button><button id="stop">Stop playlist</button></div><details><summary>Save a preset</summary><label>Name<input type="text" maxlength="40" id="presetName" placeholder="My night drive"></label><button id="savePreset">Save new preset</button></details><details><summary>Layers and zones</summary><p>Add up to two overlays. Each has its own palette and bounded region.</p><div id="layers"></div><button id="addLayer">Add overlay</button></details></section>
<script>
const $=id=>document.getElementById(id);let effects=[],palettes=[],presets=[],state={},busy=false;
const title=s=>s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
async function api(path,body){const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function options(el,values,current){el.replaceChildren();for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=title(v);el.append(o)}el.value=current}
async function change(path,body){if(busy)return;busy=true;try{await api(path,body);$('error').textContent='';await refresh(true)}catch(e){$('error').textContent=e.message}finally{busy=false}}
function sliders(){const root=$('parameters');root.replaceChildren();const spec=effects.find(e=>e.id===state.effect);for(const key of spec.parameters){const label=document.createElement('label');label.textContent=title(key);const out=document.createElement('output');const input=document.createElement('input');const val=state.params[key];input.type=typeof val==='boolean'?'checkbox':'range';if(input.type==='range'){input.min=key==='direction'?-1:0;input.max=1;input.step=key==='direction'?2:.01;input.value=val;out.textContent=Number(val).toFixed(2)}else input.checked=val;input.oninput=()=>{out.textContent=input.value};input.onchange=()=>change('state',{params:{[key]:input.type==='checkbox'?input.checked:Number(input.value)}});label.append(out,input);root.append(label)}}
function layerUI(){const root=$('layers');root.replaceChildren();state.layers.forEach((layer,i)=>{const box=document.createElement('section');for(const [key,values] of [['effect',effects.map(e=>e.id).filter(n=>n!=='passing_lights')],['palette',palettes],['zone',['full','left','right','center','top','bottom']],['blend',['add','screen','lighten','alpha','replace']]]){const label=document.createElement('label');label.textContent=title(key);const select=document.createElement('select');options(select,values,layer[key]);select.onchange=()=>{const layers=JSON.parse(JSON.stringify(state.layers));layers[i][key]=select.value;change('state',{layers})};label.append(select);box.append(label)}const opacity=document.createElement('input');opacity.type='range';opacity.min=0;opacity.max=1;opacity.step=.01;opacity.value=layer.opacity;opacity.setAttribute('aria-label','Overlay opacity');opacity.onchange=()=>{const layers=JSON.parse(JSON.stringify(state.layers));layers[i].opacity=Number(opacity.value);change('state',{layers})};const remove=document.createElement('button');remove.textContent='Remove overlay';remove.onclick=()=>change('state',{layers:state.layers.filter((_,n)=>n!==i)});box.append(opacity,remove);root.append(box)});$('addLayer').disabled=state.layers.length>=2}
async function refresh(full=false){const next=await api('state');const changed=next.effect!==state.effect||JSON.stringify(next.params)!==JSON.stringify(state.params)||JSON.stringify(next.layers)!==JSON.stringify(state.layers);state=next;$('connection').textContent=state.audio.connected?'Audio linked':'Ambient';$('status').textContent=`${state.fps} FPS · ${state.render_ms} ms/frame · ${state.ip||'Local'}${state.playlist.running?' · Playlist playing':''}`;for(const key of ['level','bass','mid','treble','beat'])$('meter_'+key).style.width=(state.audio[key]*100)+'%';if(document.activeElement.tagName==='INPUT'&&!full)return;$('power').checked=state.power;$('audio_reactive').checked=state.audio_reactive;$('brightness').value=state.brightness;$('brightnessValue').textContent=Math.round(state.brightness*100)+'%';$('effect').value=state.effect;$('palette').value=state.palette;$('preset').value=state.preset||'';if(full||changed){sliders();layerUI()}}
async function init(){try{effects=await api('effects');palettes=await api('palettes');presets=await api('presets');options($('effect'),effects.map(e=>e.id));options($('palette'),palettes);options($('preset'),['',...presets.map(p=>p.name)]);for(const key of ['level','bass','mid','treble','beat']){const label=document.createElement('label');label.textContent=title(key);const meter=document.createElement('div');meter.className='meter';const fill=document.createElement('i');fill.id='meter_'+key;meter.append(fill);label.append(meter);$('meters').append(label)}await refresh(true);poll()}catch(e){$('error').textContent=e.message;$('connection').textContent='Disconnected'}}
async function poll(){try{if(!busy)await refresh()}catch(e){$('connection').textContent='Disconnected'}setTimeout(poll,1000)}
for(const key of ['power','audio_reactive'])$(key).onchange=()=>change('state',{[key]:$(key).checked});$('brightness').oninput=()=>{$('brightnessValue').textContent=Math.round($('brightness').value*100)+'%'};$('brightness').onchange=()=>change('state',{brightness:Number($('brightness').value)});for(const key of ['effect','palette'])$(key).onchange=()=>change('state',{[key]:$(key).value});$('preset').onchange=()=>{if($('preset').value)change('preset',{name:$('preset').value})};$('save').onclick=()=>change('save',{});$('savePreset').onclick=async()=>{await change('save',{name:$('presetName').value});presets=await api('presets');options($('preset'),['',...presets.map(p=>p.name)],state.preset)};$('showcase').onclick=()=>change('playlist',{items:['Moody R&B','Cassette Night','Dreamscape','Midnight Drive'].map(preset=>({preset,duration:30,transition:1.5})),loop:true});$('stop').onclick=()=>change('playlist',null);$('addLayer').onclick=()=>change('state',{layers:[...state.layers,{effect:'waveform',palette:'purple_haze',zone:'full',blend:'add',opacity:.5}]});init();
</script></html>
